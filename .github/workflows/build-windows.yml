name: Build Windows

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-windows-libheif
          restore-keys: vcpkg-windows-

      - name: Install libheif via vcpkg
        run: vcpkg install libheif:x64-windows-static-md
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows-static-md

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build MSI
        run: pnpm tauri build
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static-md

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: photo-manager-windows-x64
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
